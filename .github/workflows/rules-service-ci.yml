name: Rules Service CI

on:
  workflow_call:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/rules-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build application jar
        run: ./gradlew bootJar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rules-service-jar
          path: services/rules-service/build/libs/*.jar
