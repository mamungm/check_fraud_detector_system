name: Fraud Detector CI

on:
  push:
    branches: [ main ]
    paths:
      - "services/fraud-detector/**"
      - ".github/workflows/fraud-detector-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "services/fraud-detector/**"
      - ".github/workflows/fraud-detector-ci.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/fraud-detector

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build application jar
        run: ./gradlew bootJar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fraud-detector-jar
          path: services/fraud-detector/build/libs/*.jar