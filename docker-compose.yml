services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: frauddb
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
    ports:
      - "5432:5432"
    volumes:
      - fraud_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fraud -d frauddb" ]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      # IMPORTANT FOR SINGLE NODE
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  fraud-detector:
    build:
      context: ./services/fraud-detector
      dockerfile: Dockerfile
    image: fraud-detector:latest
    container_name: fraud-detector
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/frauddb
      SPRING_DATASOURCE_USERNAME: fraud
      SPRING_DATASOURCE_PASSWORD: fraud
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"

  ml-service:
    build:
      context: ./services
      dockerfile: ml-service/Dockerfile
    image: ml-service:latest
    container_name: ml-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_COMPLETION_TOPIC: ML_Service_Response
    ports:
      - "8001:8001"

  image-service:
    build:
      context: ./
      dockerfile: services/image-service/Dockerfile
    image: image-service:latest
    container_name: image-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/frauddb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_COMPLETION_TOPIC: Image_Service_Response
    ports:
      - "8002:8002"

  consortium-service:
    build:
      context: ./
      dockerfile: services/consortium-service/Dockerfile
    image: consortium-service:latest
    container_name: consortium-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/frauddb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_COMPLETION_TOPIC: Consortium_Service_Response
    ports:
      - "8003:8003"

  rules-service:
    build:
      context: ./services/rules-service
      dockerfile: Dockerfile
    image: rules-service:latest
    container_name: rules-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/frauddb
      SPRING_DATASOURCE_USERNAME: fraud
      SPRING_DATASOURCE_PASSWORD: fraud
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8004:8004"

  check-fraud-app:
    build:
      context: ./check_fraud_app
      dockerfile: Dockerfile
    image: check-fraud-app:latest
    container_name: check-fraud-app
    depends_on:
      fraud-detector:
        condition: service_started
    ports:
      - "3000:80"

